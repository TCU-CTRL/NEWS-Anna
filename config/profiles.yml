profiles:
  - name: "IT業界"
    sources: "config/it/sources.yml"
    keywords: "config/it/keywords.yml"
    webhook_env: "DISCORD_WEBHOOK_URL_IT"
    emoji: "🦇"
    schedule: "daily"
    topic: "IT業界全般（AI、クラウド、セキュリティ、開発者ツール、GPU基盤）"
    priority_topics: "AI, cloud, security, developer tools, GPU clusters, ML infrastructure, job scheduling, reinforcement learning, optimization, physical AI"
    focus_areas:
      - "生成AI・LLM の最新動向（新モデル、ベンチマーク、企業導入事例）"
      - "クラウドインフラ・プラットフォーム（AWS, GCP, Azure の新サービス、障害情報）"
      - "開発者ツール・DX（IDE, CI/CD, パッケージマネージャ, DevOps）"
      - "GPU・AI基盤・HPC（GPUクラスタ、Slurm、ジョブスケジューリング、ML基盤）"
      - "数理最適化・強化学習・フィジカルAI（Gurobi, ロボティクス, シミュレーション）"
      - "SRE・オブザーバビリティ（モニタリング、インシデント対応、プラットフォームエンジニアリング）"
      - "企業動向・M&A・資金調達（スタートアップ、大手IT企業の戦略）"

  - name: "セキュリティ"
    sources: "config/security/sources.yml"
    keywords: "config/security/keywords.yml"
    webhook_env: "DISCORD_WEBHOOK_URL_SECURITY"
    emoji: "🔒"
    schedule: "daily"
    topic: "開発ツール・サプライチェーンのセキュリティインシデント"
    priority_topics: "supply chain attack, malicious extension, VSCode, npm, PyPI, GitHub Actions, CI/CD poisoning, dependency confusion, typosquatting, zero-day, CVE, RCE, container escape, backdoor, IDE security"
    focus_areas:
      - "サプライチェーン攻撃（npm, PyPI, crates.io 等の悪意あるパッケージ、依存関係汚染）"
      - "IDE・エディタ拡張のセキュリティ（VSCode, JetBrains, Cursor, Neovim プラグイン等）"
      - "CI/CD パイプラインの脅威（GitHub Actions, GitLab CI の侵害、シークレット漏洩）"
      - "コンテナ・インフラのセキュリティ（Docker Hub 悪意あるイメージ、Kubernetes 脆弱性）"
      - "認証・認可の脆弱性（OAuth バイパス、API キー漏洩、権限昇格）"
      - "ゼロデイ・重大 CVE（OS, ブラウザ, ライブラリの緊急パッチ情報）"
      - "開発者を狙うソーシャルエンジニアリング（偽リポジトリ、タイポスクワッティング、フィッシング）"

  - name: "ゲーム（ユーザー向け）"
    sources: "config/game-user/sources.yml"
    keywords: "config/game-user/keywords.yml"
    webhook_env: "DISCORD_WEBHOOK_URL_GAME_USER"
    emoji: "🎮"
    schedule: "weekly:mon"
    topic: "ゲーム業界のユーザー向けニュース（新作情報、セール、eスポーツ、レビュー）"
    priority_topics: "new releases, trailers, sales, esports, tournaments, Nintendo, PlayStation, Xbox, Steam, reviews, indie games, VR"
    focus_areas:
      - "新作・発売情報（今週のリリース、トレーラー、発売日発表）"
      - "セール・無料配布（Steam, PS Store, Xbox, Epic Games の特売情報）"
      - "eスポーツ・大会（大会結果、選手移籍、配信イベント）"
      - "話題のインディーゲーム（注目の小規模タイトル、Early Access）"

  - name: "ゲーム（開発者向け）"
    sources: "config/game-dev/sources.yml"
    keywords: "config/game-dev/keywords.yml"
    webhook_env: "DISCORD_WEBHOOK_URL_GAME_DEV"
    emoji: "🛠️"
    schedule: "weekly:mon"
    topic: "ゲーム開発技術（エンジン、グラフィクス、ネットワーク、AI、ツール）"
    priority_topics: "Unity, Unreal Engine, Godot, game AI, procedural generation, ray tracing, shaders, physics, netcode, GDC, CEDEC, postmortem, technical art, GPU, DirectX, Vulkan"
    focus_areas:
      - "ゲームエンジン（Unity, Unreal, Godot のアップデート、新機能、ベンチマーク）"
      - "グラフィクス・レンダリング（レイトレーシング、シェーダー、テクニカルアート）"
      - "ネットワーク・マルチプレイ（ネットコード、マッチメイキング、サーバーインフラ）"
      - "ゲームAI・プロシージャル生成（NPC AI、PCG、機械学習活用）"
