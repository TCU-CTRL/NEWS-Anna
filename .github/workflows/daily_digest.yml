name: Daily IT Digest

on:
  repository_dispatch:
    types: [daily-digest]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン（送信せずに動作確認のみ）"
        required: false
        type: boolean
        default: false
      test_mode:
        description: "テストモード（メッセージに [TEST] を付加）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          DIGEST_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          DIGEST_TEST_MODE: ${{ inputs.test_mode == true && '1' || '' }}
          DISCORD_WEBHOOK_URL_IT: ${{ secrets.DISCORD_WEBHOOK_URL_IT }}
          DISCORD_WEBHOOK_URL_SECURITY: ${{ secrets.DISCORD_WEBHOOK_URL_SECURITY }}
          DISCORD_WEBHOOK_URL_GAME_USER: ${{ secrets.DISCORD_WEBHOOK_URL_GAME_USER }}
          DISCORD_WEBHOOK_URL_GAME_DEV: ${{ secrets.DISCORD_WEBHOOK_URL_GAME_DEV }}
        run: python -m src.main

      - name: Commit article history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history/
          git diff --cached --quiet || git commit -m "chore: update article history [skip ci]"
          git push
